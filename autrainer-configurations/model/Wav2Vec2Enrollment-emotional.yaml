# Wav2Vec2 with enrollment personalization - "emotional" mode only
id: Wav2Vec2Enrollment-emotional
_target_: enrollment.Wav2Vec2Enrollment

# Model architecture
pretrained_name: audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim
dropout: 0.1

# Freezing configuration
freeze_feature_extractor: true
freeze_encoder: false
unfreeze_last_n_layers: 0

# Enrollment settings
enrollment: "emotional"  # Only use emotional enrollments
num_heads: 4

# Transform (raw audio input)
transform:
  type: raw
