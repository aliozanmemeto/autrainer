# Wav2Vec2 baseline - NO enrollment personalization
id: Wav2Vec2Enrollment-baseline
_target_: wav2vec2_enrollment.Wav2Vec2Enrollment

# Model architecture
pretrained_name: audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim
dropout: 0.1

# Freezing configuration
freeze_feature_extractor: true
freeze_encoder: false
unfreeze_last_n_layers: 0

# Enrollment settings
enrollment: null  # No enrollment - standard classification

# Transform (raw audio input)
transform:
  type: raw
